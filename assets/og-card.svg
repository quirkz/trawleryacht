<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">44-foot steel long-range trawler yacht — ship-like, not toy-like</title>
  <desc id="d">Social preview card: the headline “Ship-like, not toy-like” above a line profile of a steel trawler yacht.</desc>

  <defs>
    <radialGradient id="glow" cx="82%" cy="-10%" r="90%">
      <stop offset="0" stop-color="#d6a469" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#d6a469" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sea" cx="8%" cy="115%" r="75%">
      <stop offset="0" stop-color="#2c6663" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2c6663" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#08181f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#sea)"/>

  <!-- brand -->
  <g transform="translate(64 44) scale(0.95)">
