  <text x="62" y="200" font-family="P052, Palatino, 'Palatino Linotype', serif" font-size="84" letter-spacing="-2" fill="#f7f3ea">Ship-like,</text>
  <text x="62" y="282" font-family="P052, Palatino, 'Palatino Linotype', serif" font-size="84" letter-spacing="-2" font-style="italic" fill="#d6a469">not toy-like.</text>

